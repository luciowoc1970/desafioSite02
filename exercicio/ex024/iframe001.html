<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
</head>
<body>
    <!-- Configurações de estilo no CSS são soberanas -->
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">CursoEmVideo</a> para aprender a programar
    </p>
    <p>
        >Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" height="200">
        </iframe>
        para aprender a programar.
    </p>
    <!-- iframe quer dizer quadro em linha-->
     <p>
        Talvez o site do 
        <iframe src="https://www.google.com" frameborder="0"> <a href="www.google.com" target="_blank"></a>
        </iframe>
        possa aparecer dentro do iframe.
     </p>
     <p>
        O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="400" width="400">
        </iframe>
        é bem ligal.
     </p>
</body>
</html>
